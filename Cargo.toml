[package]
name = "snake"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "snake"
path = "src/main.rs"

[lib]
name = "snake"
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 3
debug = false
strip = "symbols"
incremental = true
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.19", features = ["android-native-activity"] }
# bevy = { version = "0.19", default-features = false, features = [
#         "android-native-activity",
#         "bevy_render",
#         "bevy_sprite",
#         "bevy_core_pipeline",
#         "bevy_winit",
#         "png",
#     ]}
rand = "0.10.2"
serde = {version = "1.0.229", features=["derive"]}
#android-activity = { version = "0.6.1", features = ["native-activity"] }
