[package]
name = "app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "app"
path = "src/main.rs"

[lib]
name = "app"
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
gibbon = { path = "../gibbon" }
miniquad = { version = "0.4", features = ["log-impl"] }
snake = { path = "../snake" }
